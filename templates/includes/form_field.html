{% load accessible_forms %}
<div class="form-field{% if field.errors %} has-error{% endif %}">
    <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
    {% if password %}
    <div class="password-input-wrap">
        {% accessible_field field %}
        <button type="button" class="password-toggle" aria-label="Arată parola: {{ label|default:field.label }}" aria-controls="{{ field.id_for_label }}" aria-pressed="false" data-target="{{ field.id_for_label }}" data-field-label="{{ label|default:field.label }}">
            <i class="fa fa-eye-slash" aria-hidden="true"></i>
        </button>
    </div>
    {% else %}{% accessible_field field %}{% endif %}
    {% if field.help_text %}<p class="form-field__help" id="{{ field.id_for_label }}_help">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}
    <ul class="form-field__errors" id="{{ field.id_for_label }}_errors">
        {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
    </ul>
    {% endif %}
    <span class="form-field__client-error" id="{{ field.id_for_label }}_client_error" hidden></span>
</div>
